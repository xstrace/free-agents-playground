# gost v3: 把 warp 本地 socks5(127.0.0.1:40000) 暴露到 internal 网
chains:
  - name: warp
    hops:
      - name: h0
        nodes:
          - name: n0
            addr: "127.0.0.1:40000"
            connector:
              type: socks5
            dialer:
              type: tcp

services:
  - name: socks5
    addr: ":1080"
    handler:
      type: socks5
      chain: warp
    listener:
      type: tcp

  - name: http
    addr: ":8080"
    handler:
      type: http
      chain: warp
    listener:
      type: tcp
