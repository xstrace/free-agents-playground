name: build-images
# 预构建 agent 镜像到 ghcr.io, 云端 agent 运行直接拉镜像, 不浪费运行时间装环境
# (VPS 版 proxy 已弃用, 不再构建)
on:
  push:
    branches: [main]
    paths: ['agent/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 构建并推送 fap-agent(含网关脚本)
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: true
          tags: ghcr.io/xstrace/fap-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
