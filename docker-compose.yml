name: free-agents

x-logging: &logging
  options:
    max-size: "50m"
    max-file: "3"

networks:
  internal:            # agent 唯一可及网络: 无默认路由, 只能和 proxy 对话
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  egress:              # 仅 proxy 可挂: 给 proxy 注册 WARP 和出隧道用
    driver: bridge

services:
  proxy:
    build: ./proxy
    image: fap-proxy
    container_name: fap-proxy
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 172.28.0.2
      egress:
    cap_add:
      - NET_ADMIN          # warp-svc 需要建 tun
    devices:
      - /dev/net/tun
    logging: *logging

  agent:
    build:
      context: ./agent
      args:
        PI_INSTALL: ${PI_INSTALL:-}
        PI_CMD: ${PI_CMD:-/usr/local/bin/pi}
    image: fap-agent
    container_name: fap-agent
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m,mode=0755
      - /memory:size=${MEMORY_SIZE:-64m},mode=0777
    volumes:
      - ./data/workspace:/workspace     # 10G ext4 loop 镜像(bind), 见 Makefile ensure-workspace
    depends_on:
      - proxy
    environment:
      HTTP_PROXY: http://172.28.0.2:8080
      http_proxy: http://172.28.0.2:8080
      HTTPS_PROXY: http://172.28.0.2:8080
      https_proxy: http://172.28.0.2:8080
      ALL_PROXY: socks5://172.28.0.2:1080
      all_proxy: socks5://172.28.0.2:1080
      NO_PROXY: 127.0.0.1,localhost,.local,.internal,172.28.0.2
      no_proxy: 127.0.0.1,localhost,.local,.internal,172.28.0.2
      HOME: /workspace
      PI_CMD: ${PI_CMD:-/usr/local/bin/pi}
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      # 模型提供方 key(在 .env 里填, pi 支持任意其一或多种)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    networks:
      internal:
        ipv4_address: 172.28.0.3
    dns:
      - 172.28.0.2
    cpus: ${AGENT_CPUS:-1}
    mem_limit: ${AGENT_MEM:-1g}
    memswap_limit: ${AGENT_MEM:-1g}
    pids_limit: ${AGENT_PIDS:-256}
    cap_drop: [ALL]
    cap_add:
      - SETUID          # entrypoint 内 root->agent 降权需要
      - SETGID
      - CHOWN           # 启动时 chown 宿主挂载的 /workspace
    security_opt:
      - no-new-privileges:true
    logging: *logging
